<!doctype html>
<html lang="ru">
<head>
<script src="app-data-mode.js?v=20261010-service-panel"></script>
<script src="test-fixture.js?v=20261010-service-panel"></script>
<script src="app-preferences.js?v=20261010-approved-learning"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbf9f4"><title>Word Recall · Настройки приложения</title>
  <link rel="stylesheet" href="styles.css?v=20261008-mobile-night"><link rel="stylesheet" href="app-shell.css?v=20261010-approved-learning">
  <link rel="stylesheet" href="screen-header.css"><link rel="stylesheet" href="app-spacing.css">
  <link rel="stylesheet" href="settings.css?v=20261010-service-panel">
  <script src="app-nav.js?v=20261010-service-panel" defer></script><script src="settings.js?v=20261010-approved-learning" defer></script>
<link rel="stylesheet" href="app-preferences.css?v=20261010-service-panel">
<link rel="stylesheet" href="app-guidance.css?v=20261008-clean-ui">
<script src="app-guidance.js?v=20261010-approved-learning" defer></script>
</head>
<body data-nav="settings">
<div class="workspace">
  <aside class="notes settings-notes">
    <a class="project-name" href="index.html">WORD RECALL <span>НАСТРОЙКИ</span></a>
  </aside>
  <main class="phone" aria-label="Настройки приложения">
    <div class="app-screen settings-screen">
      <header class="app-page-header"><div class="screen-header"><a class="header-back" href="index.html" aria-label="На главную">‹</a><h1 class="header-title">Настройки приложения</h1><span class="header-actions"></span></div></header>
      <section class="settings-group" aria-labelledby="languages-title"><h2 id="languages-title">Языки</h2><div class="settings-card">
        <label class="general-row"><span>Язык интерфейса</span><select aria-label="Язык интерфейса"><option>Русский</option></select></label>
        <label class="general-row"><span>Язык перевода</span><select aria-label="Язык перевода"><option>Русский</option></select></label>
      </div></section>
      <section class="settings-group" aria-labelledby="dictionaries-title"><h2 id="dictionaries-title">Словари</h2><div class="settings-card"><button class="general-row" data-open="dictionaries"><span>Мои словари</span><span class="row-value" id="dictionary-summary"></span><span class="chevron">›</span></button></div></section>
      <section class="settings-group" aria-labelledby="appearance-title"><h2 id="appearance-title">Вид</h2><div class="settings-card">
        <div class="general-row setting-wrap"><span>Оформление</span><div class="setting-segment" role="group" aria-label="Оформление"><button data-theme="day">День</button><button data-theme="night">Ночь</button></div></div>
        <label class="general-row"><span>Показать подсказки</span><input id="show-hints" class="switch" type="checkbox" role="switch"></label>
      </div></section>
      <section class="settings-group" aria-labelledby="account-title"><h2 id="account-title">Аккаунт и подписка</h2><div class="settings-card">
        <button class="general-row" data-open="account"><span>Аккаунт</span><span class="row-value" id="account-summary"></span><span class="chevron">›</span></button>
        <button class="general-row" data-open="subscription"><span>Подписка</span><span class="row-value" id="plan-summary"></span><span class="chevron">›</span></button>
        <button class="general-row" data-open="restore"><span>Восстановить покупки</span><span class="chevron">›</span></button>
      </div></section>
      <section class="settings-group" aria-labelledby="feedback-title"><h2 id="feedback-title">Обратная связь</h2>
        <form id="feedback-form"><textarea id="feedback-text" aria-label="Ваше сообщение" placeholder="Ваши пожелания к приложению. Расскажите, чего не хватает." maxlength="5000"></textarea><button class="sheet-action" type="submit" id="send-feedback" disabled>Отправить</button></form>
      </section>
      <section class="settings-group" aria-labelledby="about-title"><h2 id="about-title">О приложении</h2><div class="settings-card">
        <button class="general-row" data-open="privacy"><span>Конфиденциальность</span><span class="chevron">›</span></button>
        <button class="general-row" data-open="terms"><span>Условия использования</span><span class="chevron">›</span></button>
        <div class="general-row"><span>Word Recall</span></div>
      </div></section>
      <section class="settings-group" aria-labelledby="service-title"><h2 id="service-title">Проверка прототипа</h2><div class="settings-card">
        <button class="general-row" data-open="service"><span>Служебная панель</span><span class="chevron">›</span></button>
      </div></section>
      <p id="settings-status" role="status" hidden></p>
    </div>
  </main>
</div>
<dialog id="settings-dialog" class="general-sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header class="general-sheet-header"><h2 id="sheet-title"></h2><button id="close-sheet" aria-label="Закрыть">×</button></header><div id="sheet-body" class="general-sheet-body"></div></dialog>
<template id="service-template">
  <p class="service-description">Настройки для проверки прототипа. Вход, подписка и восстановление покупок моделируются.</p>
  <section class="service-section"><h3>Сценарии запуска</h3>
    <button class="sheet-action" id="test-first-launch">Проверить первый запуск</button>
    <p>Онбординг → стартовая главная → первое занятие. Прогресс проверки сохраняется отдельно; после неё можно вернуться к своим занятиям.</p>
    <button class="sheet-action secondary" id="exit-first-launch" hidden>Завершить проверку и вернуться</button>
    <button class="sheet-action secondary" data-open="onboarding">Показать онбординг заново</button>
  </section>
  <section class="service-section"><h3>Состояния главной</h3>
    <div class="service-preview-buttons">
      <button class="sheet-action secondary" data-preview="start">Стартовый экран</button>
      <button class="sheet-action secondary" data-preview="auto">Ежедневная главная</button>
      <button class="sheet-action secondary" data-preview="today-empty">До занятий сегодня</button>
      <button class="sheet-action secondary" data-preview="active">«В работе» — пример</button>
    </div>
    <p>Меняется представление главной. Эти примеры не меняют результаты занятий.</p>
    <label class="service-row">Пройдено циклов в примере <output id="demo-cycles-value">3</output></label>
    <input id="demo-cycles" class="service-range" aria-label="Пройдено циклов в примере" type="range" min="0" max="10" value="3">
  </section>
  <section class="service-section"><h3>Тестовые состояния</h3>
    <label class="service-row">Версия<select id="demo-plan"><option value="free">Бесплатная</option><option value="paid">Платная</option></select></label>
    <label class="service-row">Аккаунт<select id="demo-account"><option value="out">Без входа</option><option value="in">Выполнен вход</option></select></label>
    <label class="service-row">Тестовые данные<input id="demo-content" type="checkbox" role="switch"></label>
    <p>Переключение отделяет тестовые данные от ваших материалов и прогресса.</p>
    <button class="sheet-action secondary" data-open="paywall">Показать экран подписки</button>
    <label class="service-row">Восстановление покупок<select id="demo-restore"><option value="found">Покупка найдена</option><option value="empty">Покупок нет</option></select></label>
  </section>
  <p id="service-status" class="settings-action-status" role="status"></p>
</template>
<input type="file" id="dictionary-file" hidden>
</body></html>
